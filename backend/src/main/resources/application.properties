spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST}:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=18000000

admin.email=${ADMIN_EMAIL}
admin.senha=${ADMIN_SENHA}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

app.frontend-url=${FRONTEND_URL:}

cnpj.api.enabled=${CNPJ_API_ENABLED:true}
cnpj.api.base-url=${CNPJ_API_BASE_URL:https://brasilapi.com.br/api/cnpj/v1}
cnpj.api.timeout-ms=${CNPJ_API_TIMEOUT_MS:3000}
