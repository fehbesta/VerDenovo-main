spring.datasource.url=jdbc:h2:mem:verdenovo;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

server.port=8080

jwt.secret=dev-local-secret-for-verdenovo-tests-with-at-least-sixty-four-characters
jwt.expiration=18000000

admin.email=admin@verdenovo.local
admin.senha=admin123

cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

app.frontend-url=http://localhost:5173
